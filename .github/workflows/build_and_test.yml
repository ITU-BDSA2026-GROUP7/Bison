
name: .NET Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Restore Dafny tool
        working-directory: src/Bison.Razor/Dafny
        run: dotnet tool restore

      - name: Verify Dafny specifications
        working-directory: src/Bison.Razor/Dafny
        run: dotnet tool run dafny -- verify --allow-warnings FilterWrapper.dfy TaxonFilter.dfy

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build
