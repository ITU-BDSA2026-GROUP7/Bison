
name: .NET Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Restore Dafny tool
        working-directory: src/Bison.Razor/Dafny
        run: dotnet tool restore

      - name: Install Z3 solver
        working-directory: src/Bison.Razor/Dafny
        run: |
          curl -L https://github.com/dafny-lang/solver-builds/releases/download/snapshot-2023-08-02/z3-4.12.1-x64-ubuntu-20.04-bin.zip -o z3.zip
          unzip -q z3.zip
          chmod +x z3-4.12.1

      - name: Verify Dafny specifications
        working-directory: src/Bison.Razor/Dafny
        run: dotnet tool run dafny -- verify --solver-path ./z3-4.12.1 --allow-warnings FilterWrapper.dfy TaxonFilter.dfy

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build
